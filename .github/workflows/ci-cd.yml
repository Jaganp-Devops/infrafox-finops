name: InfraFox CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pip-audit
      - name: Lint (ruff)
        run: ruff check app/ --output-format=github
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt || true
      - name: Unit tests
        run: |
          if [ -d tests ] && [ "$(find tests -name 'test_*.py' | wc -l)" -gt 0 ]; then
            pytest tests/ -v
          else
            echo "No tests found yet - skipping"
          fi

  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          VITE_API_BASE_URL: ""
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt check
        run: terraform fmt -check -recursive
      - name: Terraform init
        run: terraform init -backend=false
      - name: Terraform validate
        run: terraform validate

  docker-build-scan:
    runs-on: ubuntu-latest
    needs: [backend-checks]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t infrafox-backend:${{ github.sha }} ./backend
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: infrafox-backend:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: 0

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks, secret-scan, terraform-checks, docker-build-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd ~/infrafox-finops
            git pull origin main
            cd backend
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" > ../.env
            cd ..
            docker compose up --build -d backend
            cd frontend
            rm -rf dist node_modules/.vite
            npm ci
            VITE_API_BASE_URL="" npm run build
            sudo rm -rf /var/www/infrafox/assets
            sudo cp -r dist/* /var/www/infrafox/
            sudo chown -R www-data:www-data /var/www/infrafox
      - name: Health check
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://infrafox.duckdns.org/health)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Deployment healthy: $STATUS"
